<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wallet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Wallet</title>
<style>
:root{--bg:#eef0f4;--card:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--warnbg:#fef3c7;--badbg:#fee2e2;--shadow:0 8px 30px rgba(0,0,0,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d11;--card:#171a21;--text:#eceef2;--muted:#9aa3b2;--line:#262b34;--accent:#818cf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--warnbg:#3a2e0e;--badbg:#3d1717;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d11;--card:#171a21;--text:#eceef2;--muted:#9aa3b2;--line:#262b34;--accent:#818cf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--warnbg:#3a2e0e;--badbg:#3d1717;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:520px){#app{margin:16px 0;height:calc(100% - 32px);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line)}}
header{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}
#view{flex:1;overflow-y:auto;padding:8px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
input,select,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
input,select{width:100%}
button{cursor:pointer}
.pri{background:var(--accent);color:#fff;border:0;font-weight:600}
.danger{color:var(--bad)}
.icon{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
.alert{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px}
.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.bar>i{display:block;height:100%;background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}.item .m{flex:1;min-width:0}.item .m div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{display:flex;justify-content:space-between;margin:14px 4px 6px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chip{flex:none;padding:7px 12px;border-radius:20px;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;padding:6px}
nav button span{display:block;font-size:20px}nav button.on{color:var(--accent);font-weight:700}
#fab{position:absolute;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:var(--shadow)}
#sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
#sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cg button{padding:8px 2px;font-size:12px}.cg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.lim{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.lim input{width:110px;text-align:right}
.ring{position:relative;width:110px;height:110px;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--muted)}.chart i{display:block;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px;opacity:.85;margin-bottom:4px}
button{transition:transform .1s}button:active{transform:scale(.95)}@keyframes pop{from{transform:scale(.95);opacity:0}}.alert{animation:pop .25s}.hero{background:linear-gradient(135deg,var(--accent),#a855f7);color:#fff;border:0}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">Home</h1><button id="settings" aria-label="Settings">⚙️</button></header>
  <div id="view"></div>
  <button id="fab" class="pri" aria-label="Add expense">+</button>
  <nav>
    <button data-t="home"><span>🏠</span>Home</button>
    <button data-t="history"><span>🧾</span>History</button>
    <button data-t="budgets"><span>🎯</span>Budgets</button>
  </nav>
  <div id="sheetbg"><div id="sheet"></div></div>
</div>

<script>
const CATS=[["Food","🍔"],["Transport","🚌"],["Bills","💡"],["Shopping","🛍️"],["Health","💊"],["Fun","🎬"],["Other","📦"]];
const ICON=Object.fromEntries(CATS);
const KEY="spend-tracker-v1";
let S={expenses:[],budget:{}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.expenses)S=p}}catch(e){}
S.budget=Object.assign({total:0,large:0,warn:80,cats:{}},S.budget);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayS=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ymOf=d=>d.slice(0,7);
const mLabel=ym=>new Date(ym+"-15").toLocaleString("en-IN",{month:"long",year:"numeric"});
const shift=(ym,n)=>{const d=new Date(ym+"-15");d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const sum=a=>a.reduce((s,e)=>s+e.amt,0);
let tab="home",hym=ymOf(todayS()),bym=ymOf(todayS()),q="",fc="All",toast="";
S.months=S.months||{};
function getB(ym){const k=Object.keys(S.months).filter(x=>x<=ym).sort().pop();const s=k?S.months[k]:{total:S.budget.total||0,cats:S.budget.cats||{}};return{total:s.total||0,cats:{...(s.cats||{})}}}
function setB(ym){if(!S.months[ym])S.months[ym]=getB(ym);return S.months[ym]}
function greet(){const h=new Date().getHours();return h<5?"Night owl 🦉":h<12?"Good morning ☀️":h<17?"Good afternoon 🌤️":h<21?"Good evening 🌆":"Night owl 🦉"}
function mood(t,b,n){
 if(!n)return["🐣","Fresh start! Log your first expense and let’s get going."];
 if(!b)return["🧐","Set a monthly budget and I’ll keep an eye on things for you."];
 const p=t/b*100;
 return p>=100?["🙈","Oops, the budget has left the chat. Time to go easy for a bit."]:p>=S.budget.warn?["😬","Careful now, the wallet is getting nervous."]:p>=50?["😎","Halfway there and still cruising. Nicely done!"]:["🤑","Look at you being all responsible. Keep it up!"]}

function stat(spent,limit){if(!limit)return"";const p=spent/limit*100;return p>=100?"bad":p>=S.budget.warn?"warn":""}
function alertsHTML(){
  const ex=S.expenses.filter(e=>ymOf(e.date)===ymOf(todayS())),t=sum(ex),b=getB(ymOf(todayS())),out=[];
  if(toast)out.push(["warn",toast]);
  const s=stat(t,b.total);
  if(s==="bad")out.push(["bad",`🚨 Budget blown! ${fmt(t)} spent against ${fmt(b.total)}. Time to hit the brakes.`]);
  else if(s==="warn")out.push(["warn",`⚠️ Heads up! ${Math.round(t/b.total*100)}% of your budget is gone, only ${fmt(b.total-t)} left.`]);
  CATS.forEach(([c])=>{const l=b.cats[c],sp=sum(ex.filter(e=>e.cat===c)),k=stat(sp,l);
    if(k==="bad")out.push(["bad",`🚨 ${c} went over by ${fmt(sp-l)}. Ouch!`]);
    else if(k==="warn")out.push(["warn",`⚠️ ${c} is at ${Math.round(sp/l*100)}% of its limit. Easy does it!`])});
  return out.map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join("");
}
function itemHTML(e){return `<div class="item" data-id="${e.id}"><div class="icon">${ICON[e.cat]||"📦"}</div><div class="m"><div>${esc(e.note||e.cat)}</div><div class="muted">${e.cat} · ${e.date}</div></div><b>${fmt(e.amt)}</b></div>`}

function home(){
  const m=ymOf(todayS()),ex=S.expenses.filter(e=>ymOf(e.date)===m),t=sum(ex),b=getB(m).total;
  const pct=b?Math.min(1,t/b):0,k=stat(t,b),col=k==="bad"?"var(--bad)":k==="warn"?"var(--warn)":"var(--ok)";
  const C=2*Math.PI*45;
  const recent=[...S.expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5);
  const bycat=CATS.map(([c,i])=>[c,i,sum(ex.filter(e=>e.cat===c))]).filter(x=>x[2]).sort((a,b)=>b[2]-a[2]);
  const md=mood(t,b,ex.length);
  return alertsHTML()+`<div class="card hero row" style="gap:12px"><div style="font-size:34px">${md[0]}</div><div>${md[1]}</div></div><div class="card row sp"><div><div class="muted">${mLabel(m)}</div><div style="font-size:30px;font-weight:700">${fmt(t)}</div><div class="muted">${b?`of ${fmt(b)} budget`:"No budget set yet"}</div></div>
  <div class="ring"><svg viewBox="0 0 110 110" width="110" height="110"><circle cx="55" cy="55" r="45" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="55" cy="55" r="45" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 55 55)"/></svg><b>${b?Math.round(t/b*100)+"%":"–"}</b></div></div>
  <div class="card"><h2>Top categories</h2>${bycat.length?bycat.slice(0,4).map(([c,i,v])=>`<div class="row sp"><span>${i} ${c}</span><span class="muted">${fmt(v)}</span></div><div class="bar"><i style="width:${v/t*100}%"></i></div>`).join(""):'<div class="muted">Nothing here yet. Your wallet is smiling 😌</div>'}</div>
  <div class="card"><div class="row sp"><h2>Recent</h2><button class="muted" style="border:0;background:none" data-go="history">See all</button></div>${recent.length?recent.map(itemHTML).join(""):'<div class="muted">No expenses yet. Tap + and let’s get started! ✨</div>'}</div>`;
}
function history(){
  const all=S.expenses.filter(e=>ymOf(e.date)===hym),hb=getB(hym);
  let ex=all.filter(e=>(fc==="All"||e.cat===fc)&&(!q||(e.note+" "+e.cat).toLowerCase().includes(q.toLowerCase())));
  ex.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const months=[5,4,3,2,1,0].map(n=>{const m=shift(ymOf(todayS()),-n);return[m,sum(S.expenses.filter(e=>ymOf(e.date)===m))]});
  const mx=Math.max(1,...months.map(x=>x[1]));
  const groups={};ex.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  const td=todayS(),yd=(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
  const dl=d=>d===td?"Today":d===yd?"Yesterday":new Date(d+"T12:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
  return `<div class="card row sp"><button data-m="-1">←</button><div style="text-align:center"><b>${mLabel(hym)}</b><div class="muted">${fmt(sum(all))} spent${hb.total?` of ${fmt(hb.total)} · ${Math.round(sum(all)/hb.total*100)}%`:""}</div></div><button data-m="1">→</button></div>
  <div class="card"><div class="chart">${months.map(([m,v])=>`<div><i style="height:${v/mx*80}px;${m===hym?"":"opacity:.4"}"></i>${new Date(m+"-15").toLocaleString("en-IN",{month:"short"})}</div>`).join("")}</div></div>
  <input id="q" placeholder="Search expenses" value="${esc(q)}">
  <div class="chips">${["All",...CATS.map(c=>c[0])].map(c=>`<button class="chip ${fc===c?"on":""}" data-fc="${c}">${c}</button>`).join("")}</div>
  ${Object.keys(groups).length?Object.keys(groups).map(d=>`<div class="day"><span>${dl(d)}</span><span>${fmt(sum(groups[d]))}</span></div><div class="card" style="padding:4px 14px">${groups[d].map(itemHTML).join("")}</div>`).join(""):'<div class="muted" style="text-align:center;margin-top:30px">Nothing found. Either you’re saving well or the search is too picky 🕵️</div>'}`;
}
function budgets(){
  const b=S.budget,mb=getB(bym),set=!!S.months[bym];
  return `<div class="card row sp"><button data-bm="-1">←</button><div style="text-align:center"><b>${mLabel(bym)}</b><div class="muted">${set?"Custom budget for this month":"Using the previous month’s budget"}</div></div><button data-bm="1">→</button></div>
  <div class="card"><h2>Budget for this month</h2>
  <div class="lim"><span>Monthly budget (₹)</span><input type="number" inputmode="numeric" data-b="total" value="${mb.total||""}" placeholder="0 = off"></div>
  ${CATS.map(([c,i])=>`<div class="lim"><span>${i} ${c}</span><input type="number" inputmode="numeric" data-bc="${c}" value="${mb.cats[c]||""}" placeholder="0 = none"></div>`).join("")}</div>
  <div class="card"><h2>Alerts (all months)</h2>
  <div class="lim"><span>Large purchase above (₹)</span><input type="number" inputmode="numeric" data-b="large" value="${b.large||""}" placeholder="0 = off"></div>
  <div class="lim"><span>Warn at (% of limit)</span><input type="number" inputmode="numeric" data-b="warn" value="${b.warn}" placeholder="80"></div></div>
  <button class="danger" id="clear" style="width:100%">Clear all data</button>`;
}
function render(){
  $("title").textContent={home:greet(),history:"Your spending story 🧾",budgets:"Money rules 🎯"}[tab];
  $("view").innerHTML={home,history,budgets}[tab]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  $("fab").style.display=tab==="home"?"":"none";
}
function go(t){tab=t;toast=t==="home"?toast:"";try{location.hash=t}catch(e){}render();$("view").scrollTop=0}

let editId=null,selCat="Food";
function openSheet(id){
  editId=id||null;const e=S.expenses.find(x=>x.id==id)||{amt:"",cat:"Food",note:"",date:todayS()};selCat=e.cat;
  $("sheet").innerHTML=`<div class="row sp"><b>${id?"Edit expense ✏️":"What did you spend on? 💸"}</b><button id="sx">✕</button></div>
  <input id="s_amt" type="number" inputmode="decimal" placeholder="Amount (₹)" value="${e.amt}">
  <div class="cg">${CATS.map(([c,i])=>`<button data-sc="${c}" class="${c===selCat?"on":""}">${i}<br>${c}</button>`).join("")}</div>
  <input id="s_note" placeholder="What was it for? (chai ☕, auto 🛺…)" value="${esc(e.note)}"><input id="s_date" type="date" value="${e.date}">
  <button class="pri" id="s_save">${id?"Save changes":"Log it! ✅"}</button>${id?'<button class="danger" id="s_del">Delete</button>':""}`;
  $("sheetbg").style.display="flex";setTimeout(()=>$("s_amt").focus(),50);
}
function notify(t,b){try{if(!("Notification"in window)||Notification.permission!=="granted")return;const o={body:b,icon:"icon-192.png"};if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,o)).catch(()=>{try{new Notification(t,o)}catch(e){}});else new Notification(t,o)}catch(e){}}
function levels(){const ym=ymOf(todayS()),ex=S.expenses.filter(e=>ymOf(e.date)===ym),B=getB(ym),f=s=>s==="bad"?2:s==="warn"?1:0,r={Budget:f(stat(sum(ex),B.total))};CATS.forEach(([c])=>r[c]=f(stat(sum(ex.filter(e=>e.cat===c)),B.cats[c])));return r}
function openSettings(){
  const np="Notification"in window?Notification.permission:"unsupported",R=document.documentElement;
  const dark=R.dataset.theme==="dark"||(!R.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  $("sheet").innerHTML=`<div class="row sp"><b>Settings ⚙️</b><button id="sx">✕</button></div>
  <div class="lim"><span>Theme</span><button id="theme-toggle">${dark?"Dark 🌙 · switch to light":"Light ☀️ · switch to dark"}</button></div>
  <div class="lim"><span>Notifications</span>${np==="granted"?'<span class="muted">On ✅</span>':np==="denied"?'<span class="muted">Blocked in browser</span>':np==="unsupported"?'<span class="muted">Not supported here</span>':'<button id="notif-on" class="pri" style="padding:8px 14px">Turn on</button>'}</div>
  <div class="muted">Notifications show while the app is open or installed. Background push needs a server.</div>`;
  $("sheetbg").style.display="flex"}
const closeSheet=()=>$("sheetbg").style.display="none";

document.addEventListener("click",ev=>{
  const t=ev.target,c=t.closest("[data-t],[data-go],[data-m],[data-fc],.item,[data-sc],[data-bm]");
  if(t.id==="fab")return openSheet();
  if(t.id==="sx"||t===$("sheetbg"))return closeSheet();
  if(t.id==="settings")return openSettings();
  if(t.id==="theme-toggle"){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark";return openSettings()}
  if(t.id==="notif-on"){try{Notification.requestPermission().then(openSettings)}catch(e){}return}
  if(t.id==="s_save"){
    const amt=parseFloat($("s_amt").value);if(!(amt>0))return $("s_amt").focus();
    const o={amt,cat:selCat,note:$("s_note").value.trim(),date:$("s_date").value||todayS()},before=levels();
    if(editId){Object.assign(S.expenses.find(x=>x.id==editId),o);toast=""}
    else{S.expenses.push({id:Date.now(),...o});const af=levels();for(const k in af)if(af[k]>before[k])notify(af[k]===2?k+" over limit":k+" nearing limit",af[k]===2?"You’ve passed your "+k.toLowerCase()+" limit this month.":"You’ve used "+S.budget.warn+"% of your "+k.toLowerCase()+" limit.");if(S.budget.large&&amt>=S.budget.large)notify("Large purchase",fmt(amt)+" on "+o.cat);toast=S.budget.large&&amt>=S.budget.large?`💳 Whoa, ${fmt(amt)} on ${o.cat}! Big spender energy.`:""}
    save();closeSheet();return render()}
  if(t.id==="s_del"){S.expenses=S.expenses.filter(x=>x.id!=editId);toast="";save();closeSheet();return render()}
  if(t.id==="clear"){if(confirm("Delete all expenses and budgets?")){S.expenses=[];S.months={};S.budget={total:0,large:0,warn:80,cats:{}};save();render()}return}
  if(!c)return;
  if(c.dataset.t)go(c.dataset.t);
  else if(c.dataset.go)go(c.dataset.go);
  else if(c.dataset.m){hym=shift(hym,+c.dataset.m);render()}
  else if(c.dataset.bm){bym=shift(bym,+c.dataset.bm);render()}
  else if(c.dataset.fc){fc=c.dataset.fc;render()}
  else if(c.dataset.sc){selCat=c.dataset.sc;document.querySelectorAll("[data-sc]").forEach(b=>b.classList.toggle("on",b.dataset.sc===selCat))}
  else if(c.classList.contains("item"))openSheet(c.dataset.id);
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){q=t.value;const p=t.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p);return}
  if(t.dataset.b==="total"){setB(bym).total=+t.value||0;save()}
  else if(t.dataset.b){const v=+t.value||0;S.budget[t.dataset.b]=t.dataset.b==="warn"?Math.min(99,Math.max(1,v||80)):v;save()}
  if(t.dataset.bc){setB(bym).cats[t.dataset.bc]=+t.value||0;save()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["home","history","budgets"].includes(h)&&h!==tab){tab=h;render()}});
